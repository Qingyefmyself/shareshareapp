<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问卷 - 匹配体验</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <main id="survey1-page" class="page">
            <div class="survey-content">
                <h2>问卷</h2>
                <p>为了优化匹配算法和软件体验，请完成以下问题：</p>
                
                <form id="survey1-form">
                    <div class="form-group">
                        <label>1. 你开心吗</label>
                        <div class="radio-group">
                            <label><input type="radio" name="q1" value="1"> 非常不满意</label>
                            <label><input type="radio" name="q1" value="2"> 不满意</label>
                            <label><input type="radio" name="q1" value="3"> 一般</label>
                            <label><input type="radio" name="q1" value="4"> 满意</label>
                            <label><input type="radio" name="q1" value="5"> 非常满意</label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>2. 您认为匹配到的内容与您的兴趣相关吗？</label>
                        <div class="radio-group">
                            <label><input type="radio" name="q2" value="1"> 非常不相关</label>
                            <label><input type="radio" name="q2" value="2"> 不相关</label>
                            <label><input type="radio" name="q2" value="3"> 一般</label>
                            <label><input type="radio" name="q2" value="4"> 相关</label>
                            <label><input type="radio" name="q2" value="5"> 非常相关</label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>3. 您对评价界面的使用体验如何？</label>
                        <div class="radio-group">
                            <label><input type="radio" name="q3" value="1"> 非常差</label>
                            <label><input type="radio" name="q3" value="2"> 差</label>
                            <label><input type="radio" name="q3" value="3"> 一般</label>
                            <label><input type="radio" name="q3" value="4"> 好</label>
                            <label><input type="radio" name="q3" value="5"> 非常好</label>
                        </div>
                    </div>
                    

                    
                    <button type="submit" class="primary-btn">提交问卷</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
